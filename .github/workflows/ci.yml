name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        run: go test -race ./...
      - name: gofmt gate
        run: |
          UNFORMATTED=$(gofmt -l cmd internal e2e pkg)
          if [ -n "$UNFORMATTED" ]; then echo "gofmt needed on:"; echo "$UNFORMATTED"; exit 1; fi
      - name: Fixture licensing guard
        run: ./tools/check-fixture-licenses.sh
      - name: Vet
        run: go vet ./...
      - name: Parity suites
        run: go test ./... -run 'TestParity' -count=1

  zero-cgo-matrix:
    # The trust artifact is a static binary on every platform. A cgo dep
    # sneaking in breaks cross-compilation — fail here, not at release.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: go build -o pikopod ./cmd/pikopod
      - name: Serve the example sandbox
        run: |
          ./pikopod up --spec docs/demo/examplepay.spec.json --seed docs > up.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fs http://127.0.0.1:4600/_pikopod/v1/sandboxes/examplepay/forks > /dev/null; then break; fi
            sleep 0.2
          done
          cat up.log
      - name: Jest helper (node --test)
        run: node --test helpers/jest/*.test.js
      - name: pytest helper
        run: |
          pip install pytest
          pytest -q helpers/pytest/
